name: Reviewer revision - retrieval integrity

on:
  pull_request:
    paths:
      - "scripts/experiments/build_belief_scenarios.py"
      - "src/cropstate/confidence.py"
      - "tests/test_scenario_calibration.py"
      - ".github/workflows/retrieval-integrity.yml"
  workflow_dispatch:

jobs:
  calibration-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install lightweight test dependencies
        run: python -m pip install "numpy>=1.26" "scipy>=1.13"
      - name: Verify calibrated stage belief and confidence
        run: PYTHONPATH=src python -m unittest discover -s tests -p 'test_scenario_calibration.py' -v
